# Weekly scheduled workflow (on_schedule) — runs independent of pushes.
type: workflow
stages:
  - health

jobs:
  heartbeat:
    # A build that never skips: the check is the point of every run.
    job_type: build
    skip: never
    runner: showcase
    stage: health
    checkout:
      - app
    script: |
      echo "weekly health check at $(date -u)"
      test -f app/main.txt
