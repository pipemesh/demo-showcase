# Weekly scheduled workflow (on_schedule) — runs independent of pushes.
type: workflow
stages:
  - health

jobs:
  heartbeat:
    # A task: the check is the point of every run, so it runs every time.
    job_type: task
    runner: showcase
    stage: health
    checkout:
      - app
    script: |
      echo "weekly health check at $(date -u)"
      test -f app/main.txt
