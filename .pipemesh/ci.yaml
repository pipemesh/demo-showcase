# The verify workflow — one terminal run per revision under the `ci`
# trigger node, and the same body serves PR checks (on_pull_request).
type: workflow
stages:
  - checks

jobs:
  lint:
    job_type: build
    runner: linux-arm64-micro
    stage: checks
    checkout:
      - app
    script: |
      echo "linting app sources"
      grep -q "main:" app/main.txt

  unit:
    job_type: build
    runner: linux-arm64-micro
    stage: checks
    checkout:
      - app
    setup:
      - uses: ./.pipemesh/components/announce.yaml
        with:
          message: unit suite starting
    script: |
      echo "running unit suite"
      test -s app/deps.txt

  layout:
    job_type: build
    runner: linux-arm64-micro
    stage: checks
    checkout:
      - pipemesh.yaml
      - app
    script: |
      echo "verifying repo layout"
      test -f pipemesh.yaml
      test -d app
