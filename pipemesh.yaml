# demo-showcase — one pipeline touring the PipeMesh feature surface.
# Fake project, real runs; every node exists to demonstrate a feature.
# The README maps each job to what it shows.
pipeline:
  stages: [verify, build, ship]

  jobs:
    # One fused CI node: the whole verify DAG runs as a child workflow
    # per revision and settles with a single verdict (V16 trigger node).
    ci:
      stage: verify
      delegate:
        type: workflow
        params:
          body: !include .pipemesh/ci.yaml

    # allow_failure: a red docs check must never block shipping.
    docs:
      stage: build
      allow_failure: true
      rules:
        - changes: [docs/**]
      script: |
        echo "checking docs"
        test -f docs/guide.txt

    # Changed-path rules + dependency cache + artifact production. The
    # implicit stage gate on `verify` means bundle waits for ci.
    bundle:
      stage: build
      timeout_seconds: 900
      rules:
        - changes: [app/**, .pipemesh/**, pipemesh.yaml]
      cache:
        key: deps-${checksum:app/deps.txt}
        paths: [.deps/**]
      produces:
        dist: { path: dist, expire: 14d }
      script: |
        echo "restoring dependencies (cache keyed on app/deps.txt)"
        mkdir -p .deps && cp app/deps.txt .deps/resolved.txt
        echo "bundling"
        mkdir -p dist
        cat app/main.txt app/deps.txt > dist/bundle.txt
        echo "built-from: $CI_COMMIT_SHA" >> dist/bundle.txt

    # Matrix as: jobs — regional test lanes, each consuming the bundle.
    regional_test:
      stage: build
      matrix:
        region: [us, eu]
      consumes: [bundle/dist]
      script: |
        echo "testing bundle in ${{ matrix.region }}"
        grep -q "demo application" dist/bundle.txt

    # Lane-to-lane promotion (each region deploys only what ITS lane
    # tested) + a local typed component invoked via setup:/with: — note
    # the param value carrying a ${{ matrix.* }} reference: components
    # expand first, matrix interpolates the result.
    deploy:
      stage: ship
      matrix:
        region: [us, eu]
      needs:
        - regional_test[region=${{ matrix.region }}]   # only what this region's lane tested ships
      consumes: [bundle/dist]
      setup:
        - uses: ./.pipemesh/components/announce.yaml
          with:
            message: deploying to ${{ matrix.region }}
      # The deploy log says WHAT it ships — the bundle's version line and
      # the sha it was built from — so a rollback is visible in the log.
      script: |
        echo "deploying to ${{ matrix.region }}:"
        cat dist/bundle.txt
        echo "smoke: ${{ matrix.region }} endpoint answers"
        echo "deploy to ${{ matrix.region }} complete"

pipemesh:
  pipelines:
    pipeline: !ref pipeline
  workflows:
    # PR checks: the same verify workflow runs per pull request, statuses
    # land on the PR (pipemesh/checks/*).
    checks: { body: !include .pipemesh/ci.yaml, on: pull_request }
    # Scheduled workflow — Mondays 08:00 UTC, independent of pushes.
    weekly_health: { body: !include .pipemesh/health.yaml, on: schedule, cron: "0 8 * * 1" }
